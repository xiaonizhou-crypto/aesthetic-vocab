<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Aesthetic Vocab · 看图学英文</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Lora:ital,wght@0,400;0,600;1,400;1,600&family=Caveat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#fdfdfb;--white:#fff;
  --z50:#fafafa;--z100:#f4f4f5;--z200:#e4e4e7;--z300:#d4d4d8;
  --z400:#a1a1aa;--z500:#71717a;--z700:#3f3f46;--z900:#18181b;
  --indigo:#4f46e5;--red50:#fef2f2;--red600:#dc2626;
}
html,body{min-height:100%;background:var(--bg);color:var(--z900);font-family:'Inter',system-ui,sans-serif}
button{cursor:pointer;border:none;background:none;font-family:inherit;color:inherit}
img{display:block;max-width:100%}

/* ── NAV ── */
#nav{
  position:sticky;top:0;z-index:50;
  border-bottom:1px solid var(--z100);
  background:rgba(255,255,255,.72);backdrop-filter:blur(20px);
}
.nav-inner{
  max-width:72rem;margin:0 auto;
  display:flex;align-items:center;justify-content:space-between;
  height:5rem;padding:0 1.5rem;
}
.logo-icon{
  width:2.5rem;height:2.5rem;border-radius:50%;
  background:var(--z900);color:#fff;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.logo-text{font-size:1.25rem;font-weight:700;letter-spacing:-.02em;margin-left:.75rem}
.nav-acts button{
  padding:.5rem;border-radius:50%;color:var(--z400);transition:all .2s;
}
.nav-acts button:hover{background:var(--z100);color:var(--z900)}

/* ── API KEY BAR ── */
#key-bar{
  background:#fffbeb;border-bottom:1px solid #fde68a;
  padding:.75rem 1.5rem;display:flex;align-items:center;justify-content:center;gap:.75rem;
  flex-wrap:wrap;
}
#key-bar label{font-size:.8rem;color:var(--z500);font-weight:600}
#key-input{
  flex:1;max-width:380px;padding:.5rem 1rem;
  border:1px solid var(--z200);border-radius:.5rem;
  font-size:.875rem;font-family:monospace;outline:none;
}
#key-input:focus{border-color:var(--z900)}
#key-save{
  padding:.5rem 1rem;background:var(--z900);color:#fff;
  border-radius:.5rem;font-size:.8rem;font-weight:600;
}
#key-bar.gone{display:none}

/* ── MAIN ── */
#main{max-width:56rem;margin:0 auto;padding:3rem 1.5rem}

/* ── DROPZONE ── */
#dz{
  aspect-ratio:4/5;width:100%;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  border:1px solid var(--z200);border-radius:2rem;
  background:#fff;cursor:pointer;transition:all .5s;overflow:hidden;
}
#dz:hover,#dz.over{border-color:var(--z400);box-shadow:0 25px 50px rgba(0,0,0,.12)}
#dz.over{background:var(--z50);border-color:var(--z900)}
.dz-icon{
  width:5rem;height:5rem;border-radius:50%;
  background:var(--z50);color:var(--z300);
  display:flex;align-items:center;justify-content:center;
  transition:all .5s;
}
#dz:hover .dz-icon{background:var(--z900);color:#fff;transform:scale(1.1)}
.dz-title{font-size:1.5rem;font-weight:500;color:var(--z900);margin-top:1.5rem}
.dz-sub{color:var(--z400);margin-top:.5rem}

/* ── IMAGE AREA ── */
#img-area{display:none}
#img-area.on{display:block}

.img-card{
  position:relative;border-radius:2rem;
  background:#fff;box-shadow:0 25px 50px rgba(0,0,0,.08);
  overflow:hidden;max-width:42rem;margin:0 auto;
}
#img-wrap{
  position:relative;display:flex;align-items:center;justify-content:center;
  background:var(--z100);min-height:400px;
}
#main-img{max-height:85vh;width:100%;object-fit:contain}

/* label overlay */
#lbl-root{position:absolute;pointer-events:none;top:0;left:0;width:100%;height:100%}
#lbl-inner{position:absolute;pointer-events:none}

.lbl{
  position:absolute;display:flex;flex-direction:column;
  color:#fff;cursor:pointer;pointer-events:auto;
  transition:transform .15s;
  font-family:'Caveat',cursive;
  text-shadow:0 1px 6px rgba(0,0,0,.7),0 0 2px rgba(0,0,0,.9);
  filter:drop-shadow(0 1px 3px rgba(0,0,0,.5));
}
.lbl:hover{transform:scale(1.06) !important}
.lbl-word{font-size:clamp(1.3rem,3.2vw,2.2rem);font-weight:600;white-space:nowrap;line-height:1}
.lbl-sub{display:flex;align-items:baseline;gap:.25rem;margin-top:.1rem}
.lbl-pos{font-size:clamp(.65rem,1.1vw,.8rem);opacity:.75;font-style:italic;font-weight:400}
.lbl-cn{font-size:clamp(.85rem,1.9vw,1.15rem);font-weight:400;white-space:nowrap;opacity:.9}

#close-btn{
  position:absolute;top:1.5rem;right:1.5rem;z-index:50;
  width:2.5rem;height:2.5rem;border-radius:50%;
  background:rgba(0,0,0,.4);color:#fff;
  display:flex;align-items:center;justify-content:center;
  backdrop-filter:blur(12px);transition:background .2s;
}
#close-btn:hover{background:rgba(0,0,0,.6)}

/* ── BUTTONS / LOADING ── */
#analyze-wrap{display:none;justify-content:center;margin-top:3rem}
#analyze-wrap.on{display:flex}
#analyze-btn{
  display:flex;align-items:center;gap:.75rem;
  background:var(--z900);color:#fff;
  padding:1.25rem 2.5rem;border-radius:9999px;
  font-size:1.125rem;font-weight:500;
  transition:all .2s;
}
#analyze-btn:hover{transform:scale(1.05);box-shadow:0 20px 40px rgba(0,0,0,.15)}
#analyze-btn:active{transform:scale(.95)}

#loading-wrap{display:none;flex-direction:column;align-items:center;gap:1.5rem;padding:3rem 0}
#loading-wrap.on{display:flex}
@keyframes spin{to{transform:rotate(360deg)}}
.spinner{animation:spin 1s linear infinite}
.loading-text{font-family:'Lora',serif;font-size:1.25rem;font-style:italic;color:var(--z500)}

/* ── RESULTS ── */
#results{display:none;margin-top:5rem;padding-bottom:6rem}
#results.on{display:block;animation:fadeUp .5s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}

.reflections{text-align:center;margin-bottom:5rem}
.ref-label{font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.3em;color:var(--z400)}
#scene-title{font-family:'Lora',serif;font-size:3rem;font-weight:300;font-style:italic;margin-top:1rem}
#story-en{font-family:'Lora',serif;font-size:1.5rem;line-height:1.7;color:var(--z700);margin-top:2rem;max-width:42rem;margin-left:auto;margin-right:auto}
#story-zh{font-family:'Lora',serif;font-size:1.125rem;line-height:1.7;color:var(--z400);font-style:italic;margin-top:2rem;max-width:42rem;margin-left:auto;margin-right:auto}

#story-btn{
  display:flex;align-items:center;gap:.75rem;margin:2rem auto 0;
  background:var(--z900);color:#fff;
  padding:1rem 2rem;border-radius:9999px;
  font-size:.875rem;font-weight:500;transition:all .2s;
}
#story-btn:hover:not(:disabled){transform:scale(1.05)}
#story-btn:disabled{opacity:.5;cursor:not-allowed}
#story-btn.playing{background:var(--indigo)}

.divider{display:flex;align-items:center;gap:1rem;margin:3rem 0}
.div-line{flex:1;height:1px;background:var(--z100)}
.div-lbl{font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.3em;color:var(--z400)}

#glossary{display:grid;gap:3rem;grid-template-columns:1fr 1fr}
@media(max-width:600px){#glossary{grid-template-columns:1fr}}

.vc{}
.vc-head{display:flex;align-items:flex-end;justify-content:space-between;border-bottom:1px solid var(--z100);padding-bottom:.5rem;margin-bottom:.75rem}
.vc-word{font-size:1.5rem;font-weight:700}
.vc-ph{font-family:'Lora',serif;font-size:.875rem;font-style:italic;color:var(--z400);margin-left:.75rem}
.vc-spk{color:var(--z300);transition:color .2s;padding:.25rem}
.vc-spk:hover{color:var(--z900)}
.vc-pos{font-style:italic;color:var(--z400);font-size:.875rem;margin-right:.5rem}
.vc-cn{font-weight:500}
.vc-ex{font-family:'Lora',serif;font-size:1.125rem;line-height:1.6;color:var(--z500);margin-top:.5rem}

/* ── ERROR ── */
#err-box{display:none;background:var(--red50);border-radius:1.5rem;padding:2rem;text-align:center;margin-top:2rem}
#err-box.on{display:block}
#err-box p{font-family:'Lora',serif;font-size:1.125rem;color:var(--red600)}

/* ── FOOTER ── */
footer{border-top:1px solid var(--z100);background:#fff;padding:5rem 1.5rem;text-align:center}
.ft-line{width:1px;height:3rem;background:var(--z200);margin:0 auto}
.ft-tag{font-family:'Lora',serif;font-size:.875rem;font-style:italic;color:var(--z400);margin-top:1.5rem}
.ft-copy{font-size:.625rem;font-weight:700;text-transform:uppercase;letter-spacing:.2em;color:var(--z300);margin-top:1rem}
</style>
</head>
<body>

<!-- NAV -->
<nav id="nav">
  <div class="nav-inner">
    <div style="display:flex;align-items:center">
      <div class="logo-icon">
        <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
      </div>
      <span class="logo-text">Aesthetic Vocab</span>
    </div>
    <div class="nav-acts" style="display:flex;gap:.5rem">
      <button title="Share">
        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
      </button>
      <button title="Download">
        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      </button>
      <button title="修改 API Key" onclick="showKeyBar()">
        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 11-7.778 7.778 5.5 5.5 0 017.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/></svg>
      </button>
    </div>
  </div>
</nav>

<!-- API KEY BAR -->
<div id="key-bar">
  <label for="key-input">Gemini API Key</label>
  <input type="password" id="key-input" placeholder="AIza…" autocomplete="off"/>
  <button id="key-save" onclick="saveKey()">保存</button>
</div>

<main id="main">

  <!-- DROPZONE -->
  <div id="dz">
    <input type="file" id="file-inp" accept="image/*" style="display:none"/>
    <div class="dz-icon">
      <svg width="32" height="32" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
    </div>
    <p class="dz-title">Begin your visual journey</p>
    <p class="dz-sub">Upload an image to weave words into art</p>
  </div>

  <!-- IMAGE AREA -->
  <div id="img-area">
    <div class="img-card">
      <div id="img-wrap">
        <img id="main-img" src="" alt="Canvas"/>
        <!-- label overlay -->
        <div id="lbl-root">
          <div id="lbl-inner"></div>
        </div>
      </div>
      <button id="close-btn" onclick="reset()" title="换图">
        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>

    <!-- Analyze -->
    <div id="analyze-wrap">
      <button id="analyze-btn" onclick="analyzeImage()">
        <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
        Analyze the Scene
      </button>
    </div>

    <!-- Loading -->
    <div id="loading-wrap">
      <svg class="spinner" width="48" height="48" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 12a9 9 0 11-6.22-8.56"/></svg>
      <p class="loading-text">Seeking the perfect words…</p>
    </div>

    <!-- Results -->
    <div id="results">
      <div class="reflections">
        <p class="ref-label">Reflections</p>
        <h2 id="scene-title"></h2>
        <div style="max-width:42rem;margin:0 auto">
          <p id="story-en"></p>
          <button id="story-btn" onclick="toggleStory()">
            <svg id="story-icon" width="20" height="20" fill="currentColor" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>
            <span id="story-txt">Listen to the Story</span>
          </button>
          <p id="story-zh"></p>
        </div>
      </div>

      <div class="divider">
        <div class="div-line"></div>
        <span class="div-lbl">Glossary</span>
        <div class="div-line"></div>
      </div>

      <div id="glossary"></div>
    </div>

    <!-- Error -->
    <div id="err-box"><p id="err-txt"></p></div>
  </div>

</main>

<footer>
  <div class="ft-line"></div>
  <p class="ft-tag">Where vision meets vocabulary.</p>
  <p class="ft-copy">© 2026 Visual Vocab Studio</p>
</footer>

<script>
// ─────────────────────────────────
//  State
// ─────────────────────────────────
const S = {
  imageB64: null,
  imageMime: 'image/jpeg',
  results: null,
  audioUrl: null,
  audioEl: null,
  audioState: 'idle',   // idle | loading | playing | paused
};

// ─────────────────────────────────
//  API Key
// ─────────────────────────────────
let apiKey = localStorage.getItem('gk') || '';
const keyBar = document.getElementById('key-bar');
const keyInput = document.getElementById('key-input');

if (apiKey) { keyInput.value = apiKey; keyBar.classList.add('gone'); }

function saveKey() {
  apiKey = keyInput.value.trim();
  localStorage.setItem('gk', apiKey);
  keyBar.classList.add('gone');
}
function showKeyBar() { keyBar.classList.remove('gone'); keyInput.focus(); }
keyInput.addEventListener('keydown', e => { if (e.key === 'Enter') saveKey(); });

// ─────────────────────────────────
//  File / Drop
// ─────────────────────────────────
const dz = document.getElementById('dz');
const fileInp = document.getElementById('file-inp');

dz.addEventListener('click', () => fileInp.click());
dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('over'); });
dz.addEventListener('dragleave', () => dz.classList.remove('over'));
dz.addEventListener('drop', e => {
  e.preventDefault(); dz.classList.remove('over');
  const f = e.dataTransfer.files[0];
  if (f && f.type.startsWith('image/')) loadFile(f);
});
fileInp.addEventListener('change', () => { if (fileInp.files[0]) loadFile(fileInp.files[0]); });

function loadFile(file) {
  const reader = new FileReader();
  reader.onload = () => {
    const src = reader.result;
    S.imageB64 = src.split(',')[1];
    S.imageMime = file.type || 'image/jpeg';
    document.getElementById('main-img').src = src;
    dz.style.display = 'none';
    const area = document.getElementById('img-area');
    area.classList.add('on');
    show('analyze-wrap');
    hide('loading-wrap'); hide('results'); hide('err-box');
    document.getElementById('lbl-inner').innerHTML = '';
    clearAudio();
    S.results = null;
  };
  reader.readAsDataURL(file);
}

function reset() {
  dz.style.display = '';
  document.getElementById('main-img').src = '';
  document.getElementById('img-area').classList.remove('on');
  hide('analyze-wrap'); hide('loading-wrap'); hide('results'); hide('err-box');
  document.getElementById('lbl-inner').innerHTML = '';
  clearAudio();
  S.results = null; S.imageB64 = null;
  fileInp.value = '';
}

function clearAudio() {
  if (S.audioEl) { S.audioEl.pause(); S.audioEl = null; }
  if (S.audioUrl) { URL.revokeObjectURL(S.audioUrl); S.audioUrl = null; }
  S.audioState = 'idle';
}

// ─────────────────────────────────
//  Overlay bounds
// ─────────────────────────────────
function getOverlayBounds() {
  const img = document.getElementById('main-img');
  const wrap = document.getElementById('img-wrap');
  if (!img.naturalWidth) return null;
  const r = wrap.getBoundingClientRect();
  const nat = img.naturalWidth / img.naturalHeight;
  const dis = r.width / r.height;
  let w, h, t, l;
  if (dis > nat) {
    h = r.height; w = h * nat; t = 0; l = (r.width - w) / 2;
  } else {
    w = r.width; h = w / nat; l = 0; t = (r.height - h) / 2;
  }
  return { w, h, t, l };
}

function updateOverlay() {
  const b = getOverlayBounds();
  if (!b) return;
  const inner = document.getElementById('lbl-inner');
  inner.style.cssText = `width:${b.w}px;height:${b.h}px;top:${b.t}px;left:${b.l}px`;
  if (S.results) renderLabels(S.results.items);
}

new ResizeObserver(updateOverlay).observe(document.getElementById('img-wrap'));
window.addEventListener('resize', updateOverlay);
document.getElementById('main-img').addEventListener('load', () => setTimeout(updateOverlay, 60));

// ─────────────────────────────────
//  Gemini: Analyze
// ─────────────────────────────────
async function analyzeImage() {
  if (!S.imageB64) return;
  if (!apiKey) { showKeyBar(); return; }

  hide('analyze-wrap'); show('loading-wrap'); hide('err-box');

  try {
    const res = await fetch(
      `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`,
      {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          contents: [{
            parts: [
              { inline_data: { mime_type: S.imageMime, data: S.imageB64 } },
              { text: `You are a poetic linguist teaching English through imagery. Analyze this image and choose words with soul — not plain nouns like "window" or "man", but evocative, intermediate-to-advanced vocabulary that captures the emotional texture of the scene. Think: fragile, melancholic, luminous, drape, linger, tattered, solitude, reverie, silhouette, tender, wistful — words a reader would underline.

1. Identify 6-8 such evocative words or concepts visible or felt in the image. Spread them spatially to avoid overlap.
2. For each: the English word (lowercase, casual), IPA phonetic transcription, part of speech (n./v./adj./adv.), Chinese translation, and a short poetic example sentence.
3. Bounding box coordinates (ymin, xmin, ymax, xmax) in normalized units 0–1000 pointing to where the word lives in the image.
4. Write a short, high-end literary scene description in English and Chinese.
5. Give the scene a poetic title.
Return valid JSON only.` }
            ]
          }],
          generationConfig: {
            responseMimeType: 'application/json',
            responseSchema: {
              type: 'OBJECT',
              properties: {
                title: { type: 'STRING' },
                literaryDescription: {
                  type: 'OBJECT',
                  properties: { english: { type: 'STRING' }, chinese: { type: 'STRING' } },
                  required: ['english', 'chinese']
                },
                items: {
                  type: 'ARRAY',
                  items: {
                    type: 'OBJECT',
                    properties: {
                      english: { type: 'STRING' }, phonetic: { type: 'STRING' },
                      partOfSpeech: { type: 'STRING' }, chinese: { type: 'STRING' },
                      example: { type: 'STRING' },
                      boundingBox: {
                        type: 'OBJECT',
                        properties: {
                          ymin: { type: 'NUMBER' }, xmin: { type: 'NUMBER' },
                          ymax: { type: 'NUMBER' }, xmax: { type: 'NUMBER' }
                        },
                        required: ['ymin', 'xmin', 'ymax', 'xmax']
                      }
                    },
                    required: ['english', 'phonetic', 'partOfSpeech', 'chinese', 'example', 'boundingBox']
                  }
                }
              },
              required: ['items', 'literaryDescription', 'title']
            }
          }
        })
      }
    );
    const data = await res.json();
    if (data.error) throw new Error(data.error.message);
    const raw = data.candidates?.[0]?.content?.parts?.[0]?.text || '{}';
    S.results = JSON.parse(raw);
    renderResults(S.results);
  } catch (e) {
    console.error(e);
    document.getElementById('err-txt').textContent = 'The muse is silent. ' + (e.message || 'Please try again.');
    show('err-box'); show('analyze-wrap');
  } finally {
    hide('loading-wrap');
  }
}

// ─────────────────────────────────
//  Render Results
// ─────────────────────────────────
function renderResults(d) {
  document.getElementById('scene-title').textContent = d.title || '';
  document.getElementById('story-en').textContent = d.literaryDescription?.english || '';
  document.getElementById('story-zh').textContent = '（' + (d.literaryDescription?.chinese || '') + '）';

  setStoryBtn('idle');

  document.getElementById('glossary').innerHTML = (d.items || []).map(item => `
    <div class="vc">
      <div class="vc-head">
        <div style="display:flex;align-items:baseline;gap:.75rem">
          <span class="vc-word">${esc(item.english)}</span>
          <span class="vc-ph">[${esc(item.phonetic)}]</span>
        </div>
        <button class="vc-spk" title="播放发音" onclick="speakWord('${esc(item.english)}')">
          <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
            <path d="M19.07 4.93a10 10 0 010 14.14M15.54 8.46a5 5 0 010 7.07"/>
          </svg>
        </button>
      </div>
      <p><span class="vc-pos">${esc(item.partOfSpeech)}</span><span class="vc-cn">${esc(item.chinese)}</span></p>
      <p class="vc-ex">${esc(item.example)}</p>
    </div>
  `).join('');

  show('results');
  setTimeout(updateOverlay, 80);
}

// ─────────────────────────────────
//  Label collision + render
// ─────────────────────────────────
function positionLabels(items) {
  const placed = [];
  return items.map((item, idx) => {
    const cx = (item.boundingBox.xmin + item.boundingBox.xmax) / 20;
    const cy = (item.boundingBox.ymin + item.boundingBox.ymax) / 20;
    const lw = Math.max(18, Math.min(35, item.english.length * 1.8 + item.chinese.length * 2.5));
    const lh = 12;
    let bx = cx, by = cy, found = false;

    for (const dist of [20, 30, 40, 50]) {
      const angles = Array.from({ length: 24 }, (_, i) => i * Math.PI * 2 / 24);
      angles.sort(() => Math.random() - .5);
      for (const a of angles) {
        const tx = Math.max(lw / 2 + 2, Math.min(98 - lw / 2, cx + Math.cos(a) * dist));
        const ty = Math.max(lh / 2 + 2, Math.min(98 - lh / 2, cy + Math.sin(a) * dist));
        const ok = !placed.some(p => Math.abs(p.x - tx) < (p.w + lw) * .45 && Math.abs(p.y - ty) < (p.h + lh) * .45);
        if (ok) { bx = tx; by = ty; found = true; break; }
      }
      if (found) break;
    }
    placed.push({ x: bx, y: by, w: lw, h: lh });
    const d = Math.hypot(bx - cx, by - cy);
    return { ...item, x: bx, y: by, cx, cy, right: bx > cx, showLine: idx % 3 === 0 || d > 35 };
  });
}

function renderLabels(items) {
  const inner = document.getElementById('lbl-inner');
  inner.innerHTML = '';
  positionLabels(items).forEach((item, idx) => {
    const { x, y, cx, cy, right, showLine } = item;

    const wrap = document.createElement('div');
    wrap.style.cssText = `position:absolute;top:0;left:0;width:100%;height:100%;z-index:${100-idx};pointer-events:none;opacity:0;transition:opacity .4s ${idx*.08}s`;

    if (showLine) {
      const NS = 'http://www.w3.org/2000/svg';
      const svg = document.createElementNS(NS, 'svg');
      svg.setAttribute('viewBox', '0 0 100 100');
      svg.setAttribute('preserveAspectRatio', 'none');
      svg.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;color:rgba(255,255,255,.8);filter:drop-shadow(0 1px 2px rgba(0,0,0,.5))';

      // hand-drawn circle at object center
      const g = document.createElementNS(NS, 'g');
      g.setAttribute('transform', `translate(${cx-3},${cy-3}) scale(.06)`);
      const cp = document.createElementNS(NS, 'path');
      cp.setAttribute('d', 'M50,15 C70,12 88,32 85,52 C82,72 68,88 48,85 C28,82 12,65 15,45 C18,25 35,12 55,14');
      cp.setAttribute('fill', 'none'); cp.setAttribute('stroke', 'currentColor');
      cp.setAttribute('stroke-width', '4'); cp.setAttribute('stroke-linecap', 'round');
      g.appendChild(cp);

      // dashed connector
      const ln = document.createElementNS(NS, 'path');
      const mx = (x + cx) / 2 + (right ? -5 : 5), my = (y + cy) / 2 - 5;
      ln.setAttribute('d', `M${x},${y} Q${mx},${my} ${cx},${cy}`);
      ln.setAttribute('fill', 'none'); ln.setAttribute('stroke', 'currentColor');
      ln.setAttribute('stroke-width', '.4'); ln.setAttribute('stroke-dasharray', '1 1');
      ln.setAttribute('stroke-linecap', 'round');
      svg.appendChild(g); svg.appendChild(ln);
      wrap.appendChild(svg);
    }

    const lbl = document.createElement('div');
    lbl.className = 'lbl';
    lbl.style.cssText = `left:${x}%;top:${y}%;transform:translate(${right?'-10%':'-90%'},-50%);align-items:${right?'flex-start':'flex-end'}`;
    lbl.innerHTML = `
      <span class="lbl-word">${esc(item.english)}</span>
      <div class="lbl-sub" style="flex-direction:${right?'row':'row-reverse'}">
        <span class="lbl-pos">${esc(item.partOfSpeech)}</span>
        <span class="lbl-cn">${esc(item.chinese)}</span>
      </div>`;
    lbl.onclick = () => speakWord(item.english);
    wrap.appendChild(lbl);
    inner.appendChild(wrap);
    setTimeout(() => wrap.style.opacity = '1', 20);
  });
}

// ─────────────────────────────────
//  TTS  (Gemini 2.5 Flash · Achernar = Soft)
// ─────────────────────────────────
function makeWavUrl(b64) {
  const bin = atob(b64), len = bin.length;
  const pcm = new Uint8Array(len);
  for (let i = 0; i < len; i++) pcm[i] = bin.charCodeAt(i);
  const hdr = new ArrayBuffer(44);
  const v = new DataView(hdr);
  v.setUint32(0, 0x52494646, false);
  v.setUint32(4, 36 + len, true);
  v.setUint32(8, 0x57415645, false);
  v.setUint32(12, 0x666d7420, false);
  v.setUint16(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, 24000, true); v.setUint32(28, 48000, true);
  v.setUint16(32, 2, true); v.setUint16(34, 16, true);
  v.setUint32(36, 0x64617461, false); v.setUint32(40, len, true);
  return URL.createObjectURL(new Blob([hdr, pcm], { type: 'audio/wav' }));
}

async function tts(text, voice = 'Achernar') {
  const res = await fetch(
    `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-tts:generateContent?key=${apiKey}`,
    {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        contents: [{ parts: [{ text }] }],
        generationConfig: {
          responseModalities: ['AUDIO'],
          speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName: voice } } }
        }
      })
    }
  );
  const d = await res.json();
  if (d.error) throw new Error(d.error.message);
  return d.candidates?.[0]?.content?.parts?.[0]?.inlineData?.data;
}

// Click word label or speaker icon — instant via Web Speech API
function speakWord(word) {
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(word);
  u.lang = 'en-US';
  u.rate = 0.88;
  u.pitch = 1.05;
  // prefer a male voice if available
  const voices = speechSynthesis.getVoices();
  const male = voices.find(v => v.lang.startsWith('en') && /male|guy|daniel|alex|fred|tom|oliver/i.test(v.name));
  const en = voices.find(v => v.lang === 'en-US' || v.lang === 'en-GB');
  if (male) u.voice = male;
  else if (en) u.voice = en;
  speechSynthesis.speak(u);
}

// Story play / pause
async function toggleStory() {
  if (!S.results) return;

  // Toggle if already loaded
  if (S.audioEl && S.audioUrl) {
    if (S.audioState === 'playing') {
      S.audioEl.pause(); S.audioState = 'paused'; setStoryBtn('paused');
    } else {
      S.audioEl.play().catch(() => {}); S.audioState = 'playing'; setStoryBtn('playing');
    }
    return;
  }

  // First load
  setStoryBtn('loading');
  try {
    const story = S.results.literaryDescription.english;
    const b64 = await tts(
      `Read this passage in a warm, youthful, gentle male voice — like a soft bedtime story. Natural pace, emotionally present but not dramatic:\n\n${story}`,
      'Umbriel'
    );
    if (b64) {
      S.audioUrl = makeWavUrl(b64);
      S.audioEl = new Audio(S.audioUrl);
      S.audioEl.onended = () => { S.audioState = 'paused'; setStoryBtn('paused'); };
      S.audioEl.play().catch(() => {});
      S.audioState = 'playing'; setStoryBtn('playing');
    }
  } catch (e) {
    console.error(e);
    // fallback Web Speech
    const u = new SpeechSynthesisUtterance(S.results.literaryDescription.english);
    u.lang = 'en-US'; u.rate = .8; u.pitch = .9;
    speechSynthesis.speak(u);
    setStoryBtn('idle');
  }
}

function setStoryBtn(state) {
  S.audioState = state;
  const btn = document.getElementById('story-btn');
  const icon = document.getElementById('story-icon');
  const txt = document.getElementById('story-txt');
  btn.disabled = state === 'loading';
  btn.classList.toggle('playing', state === 'playing');

  if (state === 'loading') {
    icon.innerHTML = '<path d="M21 12a9 9 0 11-6.22-8.56" style="transform-origin:center;animation:spin 1s linear infinite"/>';
    txt.textContent = 'Preparing Voice…';
  } else if (state === 'playing') {
    icon.innerHTML = '<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>';
    txt.textContent = 'Pause Story';
  } else {
    icon.innerHTML = '<polygon points="5 3 19 12 5 21 5 3"/>';
    txt.textContent = state === 'paused' ? 'Resume Story' : 'Listen to the Story';
  }
}

// ─────────────────────────────────
//  Helpers
// ─────────────────────────────────
function show(id) { document.getElementById(id).classList.add('on'); }
function hide(id) { document.getElementById(id).classList.remove('on'); }
function esc(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

// expose globals
window.analyzeImage = analyzeImage;
window.speakWord = speakWord;
window.toggleStory = toggleStory;
window.reset = reset;
window.saveKey = saveKey;
window.showKeyBar = showKeyBar;
